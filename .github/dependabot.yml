# Veille des dépendances (Dependabot).
#
# Pourquoi : la CI vérifie que le code compile et que les tests passent, mais
# elle ne dit RIEN d'une CVE publiée dans une bibliothèque déjà installée. Sans
# veille, la seule façon de l'apprendre est un audit manuel — c'est exactement
# ce qui a laissé passer le contournement de `sanitizeUrl` d'Astryx 0.1.8.
# Dependabot ouvre une PR par mise à jour ; c'est la CI qui juge.
#
# Rythme hebdomadaire et lots groupés : ce dépôt a peu de dépendances directes,
# et une PR par paquet mineur noierait les vraies alertes.
#
# RÈGLE apprise le 2026-09-17 : un lot ne contient QUE des mineures et des
# correctifs (`update-types`). Le premier lot npm groupait tout et proposait
# d'un coup React 19.3, eslint 10, TypeScript 7, KaTeX 0.18 et Astryx 0.6 — que
# `npm ci` refuse d'installer, donc une PR ni relisable ni fusionnable. Une
# majeure est un chantier : elle mérite sa propre PR, avec sa propre CI.
version: 2

updates:
  # Portail Flask
  - package-ecosystem: pip
    directory: /dgx-portal
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      portail-python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Interface Next.js
  - package-ecosystem: npm
    directory: /dgx-portal-frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Astryx est le système de design : une mineure peut changer le rendu de
      # 153 composants. On veut bien une PR pour un CORRECTIF, mais pas être
      # réveillé chaque semaine par une 0.x — les montées de cette dépendance se
      # décident et se vérifient à la main (`npx astryx upgrade`). Les MAJEURES
      # restent proposées, hors lot, justement pour qu'elles aient leur PR.
      - dependency-name: "@astryxdesign/core"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@astryxdesign/cli"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@astryxdesign/theme-neutral"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  # Actions du workflow : une action tierce compromise s'exécute avec le jeton
  # du dépôt — d'où l'épinglage par SHA, que Dependabot sait maintenir.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
