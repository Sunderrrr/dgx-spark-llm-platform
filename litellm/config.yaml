model_list:
  # Static models ornith-35b-fp8 and kat-coder-v2.5 removed on 2026-08-15
  # (dropped from the catalog + weights erased from disk, at the operator's
  # request). Models added from the portal (request approval or manual add)
  # are registered hot into the DB via /model/new — no need to list them here.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

# The proxy routes via the LiteLLM Router: it is HERE (not in litellm_settings)
# that the router's retries and timeout are set. num_retries: 0 avoids a
# slow/stuck request being replayed and grabbing additional slots on the
# single-instance backend (llama.cpp, 4 slots) until everything is blocked.
router_settings:
  num_retries: 0
  timeout: 300
  allowed_fails: 100
  cooldown_time: 5

litellm_settings:
  drop_params: true
  # Fallback for a key created WITHOUT an explicit budget (hand-created in the
  # LiteLLM dashboard). It must reflect the platform policy —
  # dgx-portal/config.py, `KEY_MAX_BUDGET` / `KEY_BUDGET_DURATION` — otherwise
  # two creation paths give two different caps depending on who creates the
  # key. Keys created by the portal, on the other hand, always carry their
  # envelope.
  default_max_budget: 200000000
  default_budget_duration: "7d"
  # Anti "blocked slots": by default LiteLLM RETRIES a request that fails/hangs
  # — on a slow single-backend model (llama.cpp, 4 slots), each retry grabs one
  # more slot, and a few failures are enough to block everything. We cut the
  # retries and bound the duration of a request (safety net: a really stuck
  # request is abandoned, which closes the connection to llama.cpp and frees
  # the slot).
  num_retries: 0
  request_timeout: 300
  # Who uses the model RIGHT NOW. LiteLLM writes SpendLogs only at the end of a
  # request and exposes no in-flight request list: the portal's admin panel
  # could therefore name nobody during a generation (measurement of
  # 2026-09-14: 44 minutes without a single row while two sessions were
  # working). This callback records the opening at start and removes it at the
  # end, into a small SQLite the portal mounts read-only. It cannot fail a
  # request: every error is traced then ignored.
  callbacks: ["cronos_inflight.en_vol"]
