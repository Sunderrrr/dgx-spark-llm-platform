# Docker log rotation (audit of 2026-10-02): with no cap, a log grows until it
# fills the disk. Observed outside compose (music 696 MB, traefik 172 MB, no
# /etc/docker/daemon.json) and growing here too. The anchor avoids copying four
# lines six times; max-size is PER container, not global.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  # ─── LiteLLM database ──────────────────────────────────────────────────────
  postgres:
    logging: *logging
    # Pinned by digest (repro + anti supply-chain). Original tag: 15-alpine,
    # embedded version verified: PostgreSQL 15.19 (image of 2026-09-20).
    # To update: docker pull postgres:15-alpine then replace the sha below and
    # check the version with `docker run --rm --entrypoint postgres <image>
    # --version`. STAY ON MAJOR 15: the `postgres_data` volume holds the
    # cluster, and PostgreSQL refuses to start on a data directory created by
    # another major version (a 15 → 17 move is a dump/restore, not an update).
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    container_name: litellm-postgres
    restart: unless-stopped
    # Hardening: single-user postgres (uid 70) with no capability and no
    # elevation. The server runs non-root; the database stays unpublished.
    user: "70:70"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm && psql -U litellm -d litellm -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── LiteLLM — API gateway + key management ────────────────────────────────
  litellm:
    logging: *logging
    # Pinned by digest (repro + anti supply-chain). Original tag: main-stable,
    # embedded version verified: 1.104.0 (image of 2026-10-04).
    # To update: docker pull ghcr.io/berriai/litellm:main-stable then replace
    # the sha below with the new digest (and check the version with: docker run
    # --rm --entrypoint python <image> -c "from importlib.metadata import
    # version; print(version('litellm'))"). AFTER ANY UPDATE, re-check that the
    # `dgx_inflight` callback is still DISPATCHED: the module relies on the
    # synchronous hooks (`log_pre_api_call` / `log_success_event` /
    # `log_failure_event`) — the async twins (`async_log_pre_api_call`) are
    # declared by `CustomLogger` but never called by LiteLLM (verified on
    # 1.102.1 AND 1.104.0: zero call site), and a class implementing only them
    # gets a table, no rows, and total silence. Send one real request and look
    # at `runtime/inflight.db`.
    image: ghcr.io/berriai/litellm@sha256:c1465d3eeb7c9f864f8a7bd057a694f9f3c092419ecdea1a9004624747b42e0e
    container_name: litellm
    restart: unless-stopped
    # Hardening (parity with dgx-portal/frontend): LiteLLM is a Python app that
    # needs no capability and must not elevate its privs.
    # NB: the upstream image runs as uid 0 by default and its Prisma bootstrap
    # does not support a non-root uid (it regenerates its node CLI under
    # $HOME/.cache) — we keep root + cap_drop ALL + no-new-privileges rather
    # than break startup. See audit H1 for the non-root track to finish on the
    # image side.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # NO published port: LiteLLM is reachable only from the Docker network.
    # Traefik (`http://litellm:4001`) and the portal (LITELLM_URL) go through
    # there; external access goes through https://api.dgx.website, which
    # additionally applies the maintenance forwardAuth — which the old
    # published port bypassed.
    volumes:
      # The proxy config is READ-ONLY: LiteLLM reads it at startup and never
      # writes it (its models live in Postgres, `store_model_in_db: true`).
      # Writable, it was a persistence path for a compromised proxy —
      # `/run/dgx` being mounted writable right next to it, it could drop a
      # plugin there and have it loaded at the next restart.
      - ./litellm/config.yaml:/app/config.yaml:ro
      # IN-FLIGHT activity (who is generating right now): small SQLite written
      # by the `dgx_inflight` callback, read by the portal. The module is
      # mounted separately to stay readable, and PYTHONPATH=/app makes it
      # importable.
      - ./dgx-portal/litellm_inflight.py:/app/dgx_inflight.py:ro
      - ./runtime:/run/dgx
    environment:
      PYTHONPATH: /app
      DGX_INFLIGHT_DB: /run/dgx/inflight.db
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Turns off the admin UI (/ui, /sso): it was publicly reachable via
      # api.dgx.website and concentrated the whole master key on an exposed
      # login form. Admin goes through the portal (dgx-portal), not this UI.
      DISABLE_ADMIN_UI: "True"
      # SSO Authentik (create an OIDC app "litellm" in Authentik, scope: openid profile email)
      GENERIC_CLIENT_ID: ${AUTHENTIK_LITELLM_CLIENT_ID}
      GENERIC_CLIENT_SECRET: ${AUTHENTIK_LITELLM_CLIENT_SECRET}
      GENERIC_AUTHORIZATION_ENDPOINT: https://gjallarhorn.dgx.website/application/o/authorize/
      GENERIC_TOKEN_ENDPOINT: https://gjallarhorn.dgx.website/application/o/token/
      GENERIC_USERINFO_ENDPOINT: https://gjallarhorn.dgx.website/application/o/userinfo/
      GENERIC_REDIRECT_URI: http://dgx.dgx.lan:4001/sso/callback
      GENERIC_CLIENT_SCOPE: "openid profile email"
    # The proxy also writes to /run/dgx/litellm.log (shared with dgx-portal,
    # mounted read-only there) so the Support can read its logs with the same
    # `read_logs` tool as the GPU services — without going through the runner
    # (a runner restart would kill the served model). The wrapper keeps the
    # GRACEFUL SHUTDOWN: `sh` is PID 1 and would swallow SIGTERM, so the
    # signal is trapped and forwarded to the proxy. The log is bounded: past
    # 20 MB it is rotated once at startup (`.1`), never grown forever.
    # Rewritten 2026-10-08: the previous one-liner died on its own test —
    # `stat` printed nothing (no file yet), `size` stayed EMPTY, and
    # `[ -gt 20000000 ]` aborted the script BEFORE the proxy ever started
    # (« sh: 20000000: unknown operand », then « you need to specify whom to
    # kill » on `kill -TERM $app`). Every API key answered 401/timeout because
    # NOTHING listened. Defaults matter: `${size:-0}` and a quoted comparison.
    # Rewritten 2026-10-08. The previous one-liner died on its own test: `stat`
    # printed nothing (no file yet), `size` stayed EMPTY, `[ -gt 20000000 ]`
    # aborted the script BEFORE the proxy ever started (« sh: 20000000: unknown
    # operand », then « you need to specify whom to kill » on `kill -TERM $app`).
    # Every API key failed because NOTHING was listening. `exec` replaces the
    # shell so SIGTERM reaches the proxy directly — no trap, no $!, nothing to
    # get wrong; the log keeps its 20 MB rotation at startup.
    entrypoint:
      - sh
      - -c
      - |
        sleep 5
        size=$(stat -c%s /run/dgx/litellm.log 2>/dev/null || echo 0)
        # `sh` chokes on an empty comparison: default it BEFORE testing.
        size=${size:-0}
        case "$size" in *[!0-9]*) size=0 ;; esac
        if [ "$size" -gt 20000000 ]; then mv /run/dgx/litellm.log /run/dgx/litellm.log.1; fi
        exec /app/docker/prod_entrypoint.sh --config /app/config.yaml --port 4001 >> /run/dgx/litellm.log 2>&1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── DGX Portal — Flask backend (API + LDAP/OIDC auth) ─────────────────────
  # No more published port on the host: the old Jinja UI is "down" (the files
  # stay intact, everything still works) but is no longer reachable from
  # outside. dgx-portal stays internally reachable via the docker-compose
  # network (dgx-portal:5000): that is what dgx-portal-frontend proxies.
  # → To go back to the old UI: put `ports: ["5000:5000"]` back here AND give
  #   dgx-portal-frontend its port 3002 back below.
  dgx-portal:
    logging: *logging
    build: ./dgx-portal
    container_name: dgx-portal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SECRET_KEY: ${WEBUI_SECRET_KEY}
      LDAP_URI: ldap://100.73.45.103:389
      # The deployment's OWN directory details live in .env, never in
      # this file: it is a public repository, and the base DN names
      # the operator's domain (audit 2026-10-07).
      LDAP_BASE: ${LDAP_BASE}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PW: ${LDAP_BIND_PW}
      LITELLM_URL: http://litellm:4001
      # Overridable for tests (fake sidecar); default = image_net sidecar.
      IMAGE_URL: ${IMAGE_URL:-http://image:8007}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Gateway of the `default` network rather than host.docker.internal: the
      # latter points at the docker0 bridge (172.17.0.1), which this container
      # reaches ONLY via its default route. But dgx-portal is multi-homed and
      # Docker puts that route on the last connected interface (asr_net,
      # 172.22.x) — a source address that vllm-restrict.service DROPs, hence
      # 3 s of timeout per probe. Aiming at 172.19.0.1 the packet leaves via
      # eth0 with a 172.19.x source, which the firewall allows. Measured:
      # 4.01 s → 0.00 s. The subnet is pinned below so the IP stays stable.
      VLLM_API_URL: http://172.19.0.1:8000/v1
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      # CTA « Open the Admin dashboard » in the emails (empty = no button).
      ADMIN_URL: ${ADMIN_URL}
      MEDIA_REQUEST_COOLDOWN_S: ${MEDIA_REQUEST_COOLDOWN_S}
      # NO KEY_MAX_BUDGET/KEY_BUDGET_DURATION here: this block long carried
      # « 0.002 » / « 1d » (a nearly exhausted test account), which overwrote
      # config.py's correct default on a FRESH install — the `settings` table
      # being empty, every account got an envelope of 0.002 tokens, hence a 429
      # on the first request. In production nobody saw it: the value had been
      # corrected by hand in Admin, and that one wins. Both values now live in
      # ONE single place: config.py's default (200 000 000 tokens / 7 d),
      # changeable in Admin → token limit.
      VLLM_RUNNER_URL: http://172.19.0.1:8001
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      # ComfyUI (MiniMax H3 video): host process, 127.0.0.1 only, never exposed.
      COMFYUI_URL: http://172.19.0.1:8188
      # OCR (baidu/Unlimited-OCR): container on ocr_net (dedicated network, not
      # `default` with litellm/postgres) — dgx-portal is multi-homed to reach it.
      OCR_URL: http://ocr:8000/v1
      # Voice (Chatterbox, cloning): same reasoning as OCR — container on the
      # dedicated voice_net, never on `default`.
      VOICE_URL: http://voice:8004
      # Transcription (Playground dictation): same, dedicated asr_net network.
      ASR_URL: http://asr:8006
      # Public URL of the OpenAI-compatible API shown to users
      PUBLIC_API_URL: https://api.dgx.website/v1
      # LiteLLM database for consumption stats (ranking + hourly graph)
      LITELLM_DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres/litellm
      TZ_DISPLAY: Europe/Paris
      # ── SSO / OIDC (Authentik) ──
      OIDC_METADATA_URL: https://gjallarhorn.dgx.website/application/o/dgx/.well-known/openid-configuration
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: https://dgx.dgx.website/api/oauth2-redirect
      OIDC_LOGOUT_URL: https://gjallarhorn.dgx.website/application/o/dgx/end-session/
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP}
      # App served over HTTPS behind Traefik → Secure session cookie
      SESSION_COOKIE_SECURE: "1"
    volumes:
      - portal_data:/app/data
      # Proxy in-flight activity, READ-ONLY: LiteLLM is the only writer, and a
      # compromised portal must not be able to touch what the proxy writes (nor
      # the reverse). Absent = the panel falls back to the finished rows only.
      - ./runtime:/run/dgx:ro
      # ComfyUI's video output, read-only: lets the portal serve past videos
      # from disk even when the video sidecar (ComfyUI) is stopped to free the GPU.
      - /root/ComfyUI/output:/comfyui-output:ro
      # Host monitor state (read-only): current incidents and freshness of the
      # portal's last dump, measured as root by the monitor. The dump folder
      # itself is NOT mounted — it is 0700 root and the dumps 0600, and that is
      # on purpose: they hold the whole database.
      - /var/lib/dgx-monitor:/var/lib/dgx-monitor:ro
      # Same token, caller side.
      - ./secrets/crawl4ai_token:/run/secrets/crawl4ai_token:ro
      # Hugging Face token, OPTIONAL, read-only: it makes gated repos visible in
      # model search and raises the anonymous API limit (500 requests / 5 min per
      # IP). The portal never returns its value, only its presence
      # (`vllm_health.hf_jeton_present`). It belongs to the container's user
      # (uid 10001) and stays 0600: nobody else on the machine can read it.
      # Missing file → the portal searches anonymously, without error (a `docker
      # compose up` on a freshly cloned repo creates a FOLDER instead: `open()`
      # fails, and that is handled as "no token").
      - ./secrets/hf_token:/run/secrets/hf_token:ro
    extra_hosts:
      # Pinned to the gateway of the `default` network, NOT to `host-gateway`.
      # `host-gateway` means the gateway of whichever interface carries the
      # default route — which depends on the order of attached networks.
      # Adding one network was enough, twice (asr_net yesterday, web_net today),
      # to flip it: packets then left as 172.22.x or 172.25.x, and
      # vllm-restrict.service — which only allows 172.19.0.0/16 towards the
      # runner and vLLM — DROPped them. No model reachable anymore.
      # This address is already the one the firewall hard-allows: we align the
      # two rather than depend on interface order.
      - "host.docker.internal:172.19.0.1"
    depends_on:
      - litellm
    networks:
      # `priority` fixes which interface carries the default route, hence the
      # SOURCE IP of outgoing calls to host.docker.internal (vLLM :8000,
      # runner :8001, ComfyUI :8188). Without it Docker picks by order of
      # alphabetical order: adding `asr_net` moved it ahead of `default`,
      # packets left as 172.22.x, and vllm-restrict.service — which only allows
      # 172.19.0.0/16 — DROPped them. Result: every probe waited its 3 s
      # timeout, ~14 s to display the home page.
      # We deliberately keep the narrow firewall rule rather than open the
      # other subnets: the OCR/voice/dictation containers have no reason to
      # reach the runner.
      # `priority`: the highest-priority interface carries the default route,
      # hence the SOURCE IP of outgoing calls. Without it, docker picks in
      # alphabetical order — adding `web_net` was enough to make packets leave
      # as 172.25.x, which vllm-restrict.service (which only allows
      # 172.19.0.0/16) DROPped: no more access to the runner nor to vLLM.
      # Observed live, exactly like when `asr_net` was added.
      default:
        priority: 100
      ocr_net: {}
      voice_net: {}
      asr_net: {}
      image_net: {}
      music_net: {}
      web_net: {}

  # ─── DGX Portal Frontend — Next.js + Astryx, full new UI ───────────────────
  # Takes over port 5000 (the one dgx-docker-restrict.service already
  # filters and Traefik routes to): nothing to change on the firewall/Traefik
  # side, they keep targeting ":5000", which now serves this container.
  # Anything that is not a known Next page is forwarded internally to
  # dgx-portal:5000 (see next.config.ts → rewrites().fallback).
  dgx-portal-frontend:
    logging: *logging
    build: ./dgx-portal-frontend
    container_name: dgx-portal-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "5000:3000"

  # ─── Web search: SearXNG (metasearch) + crawl4ai (extraction) ──────────────
  # No `ports:`: neither is reachable from outside, only dgx-portal reaches
  # them on web_net.
  searxng:
    logging: *logging
    # Digest-pinned (repro + anti supply-chain). To update:
    # docker pull searxng/searxng:latest then replace the sha above.
    image: searxng/searxng@sha256:d3e684e0d23e584740494029b67d75889934ca2812106f877bb81588fd2cbc0b
    container_name: searxng
    restart: unless-stopped
    environment:
      # Viewed from dgx-portal; also used by SearXNG for its own URLs.
      - SEARXNG_BASE_URL=http://searxng:8080/
      # Secret generated by setup.sh (no more weak public fallback).
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    volumes:
      - ./searxng:/etc/searxng:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # SearXNG (uwsgi) falls back to an unprivileged user at startup.
      - SETUID
      - SETGID
    networks:
      - web_net

  crawl4ai:
    logging: *logging
    # Digest-pinned (repro + anti supply-chain). To update:
    # docker pull unclecode/crawl4ai:latest then replace the sha above.
    image: unclecode/crawl4ai@sha256:9021b3cb5c6f12570bbcd5395638495e0a06969b3148e377b953d174af2ebc9b
    container_name: crawl4ai
    restart: unless-stopped
    volumes:
      # Without a token, crawl4ai deliberately refuses to listen beyond the
      # loopback — so it would be unreachable from dgx-portal. The token is
      # generated once into ./secrets (outside the repo, 0600) and mounted here
      # at the path its entrypoint reads on its own.
      - ./secrets/crawl4ai_token:/run/secrets/api_token:ro
    # Chromium needs shared memory: without it it crashes on somewhat heavy
    # pages. This is /dev/shm, NOT a memory limit — NEVER set `mem_limit` on a
    # sidecar of this machine (unified memory, see CLAUDE.md).
    shm_size: 1g
    security_opt:
      - no-new-privileges:true
    # crawl4ai is the most exposed component of the box (it drives a browser
    # over pages entirely controlled by third parties): we remove ALL default
    # capabilities from it, like the other sidecars.
    cap_drop:
      - ALL
    networks:
      - web_net

volumes:
  postgres_data:
  portal_data:

networks:
  # NB: subnet NOT pinned here — doing so forces Docker to recreate the
  # network, which it refuses because traefik (outside this compose) is
  # attached to it. 172.19.0.0/16 is the stable allocation observed;
  # vllm-restrict.service allows it and the URLs above target its gateway
  # 172.19.0.1.
  default:
  # Dedicated OCR network: the OCR container (vllm-openai image, the admin can
  # relaunch it with --trust-remote-code on another HF repo, see README
  # « Security ») is NO LONGER on `default` with litellm/postgres/traefik —
  # only dgx-portal (which talks to it over HTTP, see OCR_URL) is multi-homed
  # on both networks. Arbitrary code executed in this container (malicious HF
  # repo) therefore has no direct L3 route to litellm/postgres.
  ocr_net:
  # Same isolation as ocr_net, for the voice container (Chatterbox): it too
  # receives user-provided audio/text into third-party model code, same risk
  # surface as OCR.
  voice_net:
  # Same for transcription: user audio goes through third-party model code, it
  # has no business on the litellm/postgres network.
  asr_net:
  # Image generation (diffusers): same posture as the other sidecars — receives
  # a user prompt into third-party model code, isolated from litellm/postgres.
  # Only dgx-portal reaches it (IMAGE_URL=http://image:8007).
  image_net:
  # Music generation (MiniMax-Music3 & co, diffusers): same, and all the more so
  # since the model is freely chosen from the admin — arbitrary third-party
  # model code has no business on the litellm/postgres network.
  music_net:
  # Web search: this is the MOST exposed sidecar of the machine — crawl4ai
  # drives a browser visiting arbitrary pages, i.e. content entirely controlled
  # by third parties, and SearXNG queries external engines. Neither has the
  # slightest reason to have a route to litellm, postgres or traefik. Only
  # dgx-portal is multi-homed onto it.
  web_net:

# ─── OpenWebUI ────────────────────────────────────────────────────────────────
# OpenWebUI runs on your other server (vor.dgx.website).
# Change in its config:
#   OLLAMA_BASE_URL  →  remove
#   Add:
#     OPENAI_API_BASE_URL=https://api.dgx.website/v1
#       (and NOT http://dgx.dgx.lan:4001: LiteLLM listens only on the
#        internal docker network, no port is published on the host — the only
#        path from outside is Traefik → https://api.dgx.website)
#     OPENAI_API_KEY=<LITELLM_MASTER_KEY>
# Keep everything else (Authentik SSO, roles, etc.) identical.
