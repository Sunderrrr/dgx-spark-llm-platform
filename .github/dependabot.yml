# Veille des dépendances (Dependabot) — ALERTES ACTIVES, PR AUTOMATIQUES EN PAUSE.
#
# Pourquoi la veille : la CI vérifie que le code compile et que les tests passent,
# mais elle ne dit RIEN d'une CVE publiée dans une bibliothèque déjà installée.
# Sans veille, la seule façon de l'apprendre est un audit manuel — c'est exactement
# ce qui a laissé passer le contournement de `sanitizeUrl` d'Astryx 0.1.8.
#
# Pourquoi les PR sont en PAUSE (`open-pull-requests-limit: 0`, 2026-10-01) : le
# dépôt doit garder UNE seule branche (`master`). Chaque PR Dependabot crée la
# sienne, et trois branches dormaient sur le distant (deux Dependabot, une
# ancienne) pour des mises à jour que personne n'avait relues. Le dépôt perdait sa
# lisibilité pour un bénéfice que la CI apporte déjà : le job « Dependency audit »
# (pip-audit + npm audit, advisory) tourne à chaque push et écrit ses résultats
# dans le résumé du run. Les ALERTES Dependabot (onglet Security) restent actives :
# c'est elles qui préviennent d'une CVE, sans créer de branche. Vérifié le
# 2026-10-01 : elles étaient DÉSACTIVÉES sur le dépôt (404 sur
# `/vulnerability-alerts`) — les activer est ce qui rend cette pause acceptable,
# sinon mettre les PR en pause aurait supprimé la seule veille automatique.
# Les CORRECTIFS de sécurité automatiques restent désactivés, à l'inverse, parce
# qu'eux ouvrent une PR : l'alerte suffit, la correction se fait à la main.
#
# POUR REPRENDRE UNE MISE À JOUR : la faire à la main, dans un commit unique et
# relisible — `npm audit fix` / `npm update <paquet>` côté frontend (le verrou est
# désormais diffable, cf. `.gitattributes`), `pip install -U` + `pip freeze` côté
# portail — puis pousser et laisser la CI juger. Pour réactiver les PR, remettre un
# `open-pull-requests-limit` non nul ci-dessous (commencer à 1 : un lot à la fois,
# jamais trois branches ouvertes en parallèle).
#
# RÈGLE apprise le 2026-09-17 (elle vaut pour toute reprise manuelle) : un lot ne
# contient QUE des mineures et des correctifs (`update-types`). Le premier lot npm
# groupait tout et proposait d'un coup React 19.3, eslint 10, TypeScript 7, KaTeX
# 0.18 et Astryx 0.6 — que `npm ci` refuse d'installer, donc une PR ni relisable ni
# fusionnable. Une majeure est un chantier : elle mérite sa propre PR, avec sa
# propre CI.
version: 2

updates:
  # Portail Flask
  - package-ecosystem: pip
    directory: /dgx-portal
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      portail-python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Interface Next.js
  - package-ecosystem: npm
    directory: /dgx-portal-frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      frontend-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Astryx est le système de design : une mineure peut changer le rendu de
      # 153 composants. On veut bien une PR pour un CORRECTIF, mais pas être
      # réveillé chaque semaine par une 0.x — les montées de cette dépendance se
      # décident et se vérifient à la main (`npx astryx upgrade`). Les MAJEURES
      # restent proposées, hors lot, justement pour qu'elles aient leur PR.
      - dependency-name: "@astryxdesign/core"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@astryxdesign/cli"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@astryxdesign/theme-neutral"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # Les TYPES de Node suivent le RUNTIME, ils ne le précèdent pas :
      # l'image est `node:20-slim` (épinglée par digest, cf. Dockerfile). Des
      # `@types/node` 26 compiler sur un Node 20 feraient accepter par `tsc` des
      # API absentes à l'exécution — une divergence que la CI ne voit pas, puis-
      # qu'elle se contente de vérifier que le code actuel compile. Le jour où le
      # runtime bouge, les deux se mettent à jour dans le même commit.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 et ESLint 10 sont BLOQUÉS EN AMONT, pas par notre code —
      # mesuré le 2026-09-17 sur les deux PR (#6, #8) : les deux échouent à
      # l'étape Lint, jamais à l'installation ni au type-check.
      #   - #6 : `npx tsc --noEmit` passe avec TypeScript 7.0.2 (0 erreur), mais
      #     `typescript-eslint` — fourni par `eslint-config-next` — LÈVE à
      #     l'import dès `typescript` majeur ≥ 7 (« typescript-eslint does not
      #     support TS 7.0 », suivi en amont : typescript-eslint#10940).
      #   - #8 : ESLint 10 retire `context.getFilename()` ; le
      #     `eslint-plugin-react` fourni par `eslint-config-next` l'appelle
      #     encore, et la DERNIÈRE version publiée (7.37.5) déclare toujours
      #     `eslint: ^3 … ^9.7` — aucun correctif disponible en aval.
      # Les livrer demanderait de remplacer le lint de Next.js par une
      # configuration maison : ce n'est pas une montée de dépendance, c'est un
      # chantier à part entière (et il retirerait des règles qu'on veut garder).
      # POUR REPRENDRE : retirer les deux `ignore` ci-dessous, puis
      # `npm i -D typescript@^7 eslint@^10 && npx tsc --noEmit && npx eslint .` —
      # si le lint passe, la montée est mûre ; sinon, remettre l'ignore.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # Actions du workflow : une action tierce compromise s'exécute avec le jeton
  # du dépôt — d'où l'épinglage par SHA, que Dependabot sait maintenir.
  # En pause comme les autres (même raison : UNE branche), mais la veille reste :
  # les actions tierces remontent, elles aussi, dans le graphe de dépendances et
  # donc dans les alertes Dependabot. Une montée de SHA se fait à la main, et se
  # relit en une ligne.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
