services:

  # ─── Base de données LiteLLM ───────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine@sha256:cd17e2ac98240fce1541ad2a803b34009b4eea5aec8a832363cdc7eca62e722e
    container_name: litellm-postgres
    restart: unless-stopped
    # Durcissement : mono-utilisateur postgres (uid 70) sans capability et sans
    # elevation. Le serveur s'exécute en non-root ; la base reste non publiée.
    user: "70:70"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm && psql -U litellm -d litellm -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── LiteLLM — API gateway + gestion des clés ─────────────────────────────
  litellm:
    # Épinglé au digest (repro + anti supply-chain). Tag d'origine : main-latest.
    # Pour mettre à jour : docker pull ghcr.io/berriai/litellm:main-latest puis
    # remplacer le sha ci-dessous par le nouveau digest.
    image: ghcr.io/berriai/litellm@sha256:80ea654c506da9083503d00c1b323b2fecddf17af6add9bf01b2603938e17bd2
    container_name: litellm
    restart: unless-stopped
    # Durcissement (parité avec dgx-portal/frontend) : LiteLLM est une appli
    # Python qui n'a besoin d'aucune capability et ne doit pas élever ses privs.
    # NB: l'image amont tourne en uid 0 par défaut et son bootstrap Prisma ne
    # supporte pas un uid non-root (il régénère sa CLI node sous $HOME/.cache) —
    # on garde root + cap_drop ALL + no-new-privileges plutôt que de casser le
    # démarrage. Voir audit H1 pour la piste non-root à finaliser côté image.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # AUCUN port publié : LiteLLM n'est joignable que depuis le réseau Docker.
    # Traefik (`http://litellm:4001`) et le portail (LITELLM_URL) passent par là ;
    # l'accès externe se fait par https://api.cronos.website, qui applique en plus
    # le forwardAuth de maintenance — que l'ancien port publié court-circuitait.
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Coupe l'UI d'admin (/ui, /sso) : elle était publiquement joignable via
      # api.cronos.website et concentrait toute la master key sur un formulaire
      # de login exposé. L'admin passe par le portail (dgx-portal), pas cette UI.
      DISABLE_ADMIN_UI: "True"
      # SSO Authentik (crée une app OIDC "litellm" dans Authentik, scope: openid profile email)
      GENERIC_CLIENT_ID: ${AUTHENTIK_LITELLM_CLIENT_ID}
      GENERIC_CLIENT_SECRET: ${AUTHENTIK_LITELLM_CLIENT_SECRET}
      GENERIC_AUTHORIZATION_ENDPOINT: https://gjallarhorn.cronos.website/application/o/authorize/
      GENERIC_TOKEN_ENDPOINT: https://gjallarhorn.cronos.website/application/o/token/
      GENERIC_USERINFO_ENDPOINT: https://gjallarhorn.cronos.website/application/o/userinfo/
      GENERIC_REDIRECT_URI: http://dgx.cronos.lan:4001/sso/callback
      GENERIC_CLIENT_SCOPE: "openid profile email"
    entrypoint: ["sh", "-c", "sleep 5 && /app/docker/prod_entrypoint.sh --config /app/config.yaml --port 4001"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── DGX Portal — backend Flask (API + auth LDAP/OIDC) ─────────────────────
  # Plus de port publié sur l'hôte : l'ancienne interface Jinja est "down" (les
  # fichiers restent intacts, tout marche encore) mais n'est plus atteignable
  # depuis l'extérieur. dgx-portal reste joignable en interne via le réseau
  # docker-compose (dgx-portal:5000) : c'est ce que dgx-portal-frontend proxy.
  # → Pour revenir à l'ancienne interface : remettre `ports: ["5000:5000"]`
  #   ici ET redonner à dgx-portal-frontend son port 3002 ci-dessous.
  dgx-portal:
    build: ./dgx-portal
    container_name: dgx-portal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SECRET_KEY: ${WEBUI_SECRET_KEY}
      LDAP_URI: ldap://100.73.45.103:389
      LDAP_BASE: dc=cronos,dc=lan
      LDAP_BIND_DN: cn=ldap,ou=users,dc=cronos,dc=lan
      LDAP_BIND_PW: ${LDAP_BIND_PW}
      LITELLM_URL: http://litellm:4001
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Passerelle du réseau `default` plutôt que host.docker.internal : ce
      # dernier pointe la bridge docker0 (172.17.0.1), que ce conteneur
      # n'atteint QUE par sa route par défaut. Or dgx-portal est multi-homé et
      # Docker place cette route sur la dernière interface connectée (asr_net,
      # 172.22.x) — adresse source que vllm-restrict.service met en DROP, d'où
      # 3 s de timeout par sonde. En visant 172.19.0.1 le paquet part par eth0
      # avec une source 172.19.x, que le pare-feu autorise. Mesuré : 4,01 s →
      # 0,00 s. Le sous-réseau est épinglé plus bas pour que l'IP soit stable.
      VLLM_API_URL: http://172.19.0.1:8000/v1
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      # CTA « Open the Admin dashboard » dans les emails (si vide, aucun bouton).
      ADMIN_URL: ${ADMIN_URL}
      MEDIA_REQUEST_COOLDOWN_S: ${MEDIA_REQUEST_COOLDOWN_S}
      KEY_MAX_BUDGET: "0.002"
      KEY_BUDGET_DURATION: "1d"
      VLLM_RUNNER_URL: http://172.19.0.1:8001
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      # ComfyUI (vidéo MiniMax H3) : process host, 127.0.0.1 only, jamais exposé.
      COMFYUI_URL: http://172.19.0.1:8188
      # OCR (baidu/Unlimited-OCR) : conteneur sur ocr_net (réseau dédié, pas
      # `default` avec litellm/postgres) — dgx-portal est multi-homé pour l'atteindre.
      OCR_URL: http://ocr:8000/v1
      # Voix (Chatterbox, clonage) : même raisonnement que OCR — conteneur sur
      # voice_net dédié, jamais sur `default`.
      VOICE_URL: http://voice:8004
      # Transcription (dictée du Playground) : idem, réseau asr_net dédié.
      ASR_URL: http://asr:8006
      # URL publique de l'API compatible OpenAI affichée aux utilisateurs
      PUBLIC_API_URL: https://api.cronos.website/v1
      # Base LiteLLM pour les stats de consommation (ranking + graphe horaire)
      LITELLM_DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres/litellm
      TZ_DISPLAY: Europe/Paris
      # ── SSO / OIDC (Authentik) ──
      OIDC_METADATA_URL: https://gjallarhorn.cronos.website/application/o/dgx/.well-known/openid-configuration
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: https://dgx.cronos.website/api/oauth2-redirect
      OIDC_LOGOUT_URL: https://gjallarhorn.cronos.website/application/o/dgx/end-session/
      OIDC_ADMIN_GROUP: adm_cronos
      # App servie en HTTPS derrière Traefik → cookie de session Secure
      SESSION_COOKIE_SECURE: "1"
    volumes:
      - portal_data:/app/data
      # ComfyUI's video output, read-only: lets the portal serve past videos
      # from disk even when the video sidecar (ComfyUI) is stopped to free the GPU.
      - /root/ComfyUI/output:/comfyui-output:ro
      # Même jeton, côté appelant.
      - ./secrets/crawl4ai_token:/run/secrets/crawl4ai_token:ro
    extra_hosts:
      # Épinglé sur la passerelle du réseau `default`, PAS sur `host-gateway`.
      # `host-gateway` désigne la passerelle de l'interface qui porte la route par
      # défaut — laquelle dépend de l'ordre des réseaux attachés. L'ajout d'un
      # réseau a suffi, deux fois (asr_net hier, web_net aujourd'hui), à la faire
      # basculer : les paquets sortaient alors en 172.22.x ou 172.25.x, et
      # vllm-restrict.service — qui n'autorise que 172.19.0.0/16 vers le runner
      # et vLLM — les mettait en DROP. Plus aucun modèle joignable.
      # Cette adresse est déjà celle que le pare-feu autorise en dur : on aligne
      # les deux plutôt que de dépendre d'un ordre d'interfaces.
      - "host.docker.internal:172.19.0.1"
    depends_on:
      - litellm
    networks:
      # `priority` fixe l'interface qui porte la route par défaut, donc l'IP
      # SOURCE des appels sortants vers host.docker.internal (vLLM :8000,
      # runner :8001, ComfyUI :8188). Sans ça Docker choisit par ordre
      # alphabétique : l'ajout de `asr_net` l'a fait passer devant `default`,
      # les paquets sont partis en 172.22.x, et vllm-restrict.service — qui
      # n'autorise que 172.19.0.0/16 — les a mis en DROP. Résultat : chaque
      # sonde attendait son timeout de 3 s, ~14 s pour afficher l'accueil.
      # On garde volontairement la règle pare-feu étroite plutôt que d'ouvrir
      # les autres sous-réseaux : les conteneurs OCR/voix/dictée n'ont aucune
      # raison d'atteindre le runner.
      # `priority` : c'est l'interface de plus haute priorité qui porte la route
      # par défaut, donc l'IP SOURCE des appels sortants. Sans elle, docker
      # choisit par ordre alphabétique — l'ajout de `web_net` a suffi à faire
      # sortir les paquets en 172.25.x, que vllm-restrict.service (qui n'autorise
      # que 172.19.0.0/16) a mis en DROP : plus aucun accès au runner ni à vLLM.
      # Constaté en direct, exactement comme lors de l'ajout d'`asr_net`.
      default:
        priority: 100
      ocr_net: {}
      voice_net: {}
      asr_net: {}
      image_net: {}
      music_net: {}
      web_net: {}

  # ─── DGX Portal Frontend — Next.js + Astryx, nouvelle interface complète ──
  # Reprend le port 5000 (celui que filtre déjà cronos-docker-restrict.service
  # et vers lequel Traefik route) : rien à changer côté pare-feu/Traefik, ils
  # continuent de cibler ":5000", qui sert maintenant ce conteneur. Tout ce qui
  # n'est pas une page Next connue est transmis en interne à dgx-portal:5000
  # (voir next.config.ts → rewrites().fallback).
  dgx-portal-frontend:
    build: ./dgx-portal-frontend
    container_name: dgx-portal-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "5000:3000"

  # ─── Recherche web : SearXNG (métamoteur) + crawl4ai (extraction) ──────────
  # Aucun `ports:` : ni l'un ni l'autre n'est joignable depuis l'extérieur, seul
  # dgx-portal les atteint sur web_net.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      # Vue depuis dgx-portal ; sert aussi à SearXNG pour ses propres URL.
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-cronos-searxng-local}
    volumes:
      - ./searxng:/etc/searxng:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # SearXNG (uwsgi) se rabat sur un utilisateur non privilégié au démarrage.
      - SETUID
      - SETGID
    networks:
      - web_net

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    restart: unless-stopped
    volumes:
      # Sans jeton, crawl4ai refuse délibérément d'écouter ailleurs que sur la
      # boucle locale — il serait donc injoignable depuis dgx-portal. Le jeton est
      # généré une fois dans ./secrets (hors dépôt, 0600) et monté ici sous le
      # chemin que son entrypoint lit tout seul.
      - ./secrets/crawl4ai_token:/run/secrets/api_token:ro
    # Chromium a besoin de mémoire partagée : sans ça il plante sur les pages
    # un peu lourdes. C'est /dev/shm, PAS une limite mémoire — on ne met JAMAIS
    # `mem_limit` sur un sidecar de cette machine (mémoire unifiée, cf. CLAUDE.md).
    shm_size: 1g
    security_opt:
      - no-new-privileges:true
    # crawl4ai est le composant le plus exposé de la box (il pilote un navigateur
    # sur des pages entièrement contrôlées par des tiers) : on lui retire TOUTES
    # les capabilities par défaut, comme les autres sidecars.
    cap_drop:
      - ALL
    networks:
      - web_net

volumes:
  postgres_data:
  portal_data:

networks:
  # NB : sous-réseau NON épinglé ici — le faire force Docker à recréer le
  # réseau, ce qu'il refuse car traefik (hors de ce compose) y est attaché.
  # 172.19.0.0/16 est l'attribution stable constatée ; vllm-restrict.service
  # l'autorise et les URL ci-dessus visent sa passerelle 172.19.0.1.
  default:
  # Réseau dédié OCR : le conteneur OCR (image vllm-openai, admin peut le
  # relancer avec --trust-remote-code sur un autre modèle HF, cf. README
  # « Security ») n'est PLUS sur `default` avec litellm/postgres/traefik —
  # seul dgx-portal (qui lui parle en HTTP, cf. OCR_URL) est multi-homé sur
  # les deux réseaux. Un code arbitraire exécuté dans ce conteneur (repo HF
  # malveillant) n'a donc plus de route L3 directe vers litellm/postgres.
  ocr_net:
  # Même isolation que ocr_net, pour le conteneur voix (Chatterbox) : reçoit
  # lui aussi de l'audio/texte fourni par l'utilisateur vers du code de
  # modèle tiers, même surface de risque que OCR.
  voice_net:
  # Idem pour la transcription : de l'audio utilisateur passe dans du code de
  # modèle tiers, il n'a rien à faire sur le réseau de litellm/postgres.
  asr_net:
  # Génération d'image (diffusers) : même posture que les autres
  # sidecars — reçoit un prompt utilisateur vers du code de modèle tiers, isolé
  # de litellm/postgres. Seul dgx-portal l'atteint (IMAGE_URL=http://image:8007).
  image_net:
  # Génération musicale (MiniMax-Music3 & co, diffusers) : idem, et d'autant
  # plus que le modèle est choisi librement depuis l'admin — du code de modèle
  # tiers arbitraire n'a rien à faire sur le réseau de litellm/postgres.
  music_net:
  # Recherche web : c'est le sidecar le PLUS exposé de la machine — crawl4ai
  # pilote un navigateur qui visite des pages arbitraires, donc du contenu
  # entièrement contrôlé par des tiers, et SearXNG interroge des moteurs
  # externes. Ni l'un ni l'autre n'a la moindre raison d'avoir une route vers
  # litellm, postgres ou traefik. Seul dgx-portal est multi-homé dessus.
  web_net:

# ─── OpenWebUI ────────────────────────────────────────────────────────────────
# OpenWebUI tourne sur ton autre serveur (vor.cronos.website).
# Change dans sa config :
#   OLLAMA_BASE_URL  →  supprimer
#   Ajouter :
#     OPENAI_API_BASE_URL=http://dgx.cronos.lan:4001/v1
#     OPENAI_API_KEY=<LITELLM_MASTER_KEY>
# Garde tout le reste (Authentik SSO, rôles, etc.) identique.
