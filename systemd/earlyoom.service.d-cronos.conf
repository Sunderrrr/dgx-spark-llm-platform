# Filet de securite GLOBAL contre l'OOM (pose le 2026-10-01, apres une boucle de
# plantages). Sur le GB10 la memoire GPU n'apparait dans aucun processus : le tueur
# OOM du noyau en est aveugle et tue tout le reste (443 processus le 2026-10-01,
# machine gelee puis redemarree). earlyoom agit AVANT lui, sur MemAvailable — que
# la memoire GPU fait bien baisser.
#
#  -m 3,2       SIGTERM sous 3 % de memoire disponible (~3,7 Go), SIGKILL sous 2 %
#  -s 100,100   IGNORER le swap : par defaut earlyoom exige AUSSI un swap bas, or la
#               memoire GPU ne swappe pas (75 % de swap libre pendant l'OOM) — avec
#               les reglages par defaut il ne se serait jamais declenche
#  --prefer     viser llama-server : sa memoire GPU n'est pas dans son RSS, sans
#               cette preference earlyoom tuerait un processus innocent a gros RSS
#  --avoid      ne jamais toucher aux services dont depend l'acces a la machine
#  $$ = $ litteral dans un fichier d'unite systemd
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -m 3,2 -s 100,100 -r 3600 -p --prefer (^|/)llama-server$$ --avoid (^|/)(sshd|systemd|systemd-[a-z-]+|dockerd|containerd|containerd-shim|traefik|postgres|init|earlyoom)$$
