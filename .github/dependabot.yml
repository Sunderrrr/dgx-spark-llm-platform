# Dependency watch (Dependabot) — ALERTS ACTIVE, AUTOMATIC PRs ON HOLD.
#
# Why the watch: CI checks that the code compiles and the tests pass, but it
# says NOTHING about a CVE published in an already-installed library. Without a
# watch, the only way to learn about it is a manual audit — that is exactly
# what let the `sanitizeUrl` bypass in Astryx 0.1.8 slip through.
#
# Why the PRs are ON HOLD (`open-pull-requests-limit: 0`, 2026-10-01): the repo
# must keep ONE single branch (`master`). Every Dependabot PR creates its own,
# and three branches were sleeping on the remote (two Dependabot, one old) for
# updates nobody had reviewed. The repo was losing its readability for a
# benefit CI already brings: the "Dependency audit" job (pip-audit + npm audit,
# advisory) runs at every push and writes its results into the run summary. The
# Dependabot ALERTS (Security tab) stay active: they are what warns about a
# CVE, without creating a branch. Verified on 2026-10-01: they were DISABLED on
# the repo (404 on `/vulnerability-alerts`) — enabling them is what makes this
# pause acceptable, otherwise pausing the PRs would have removed the only
# automatic watch. Automatic security FIXES stay disabled, on the other hand,
# because those open a PR: the alert is enough, the fix is done by hand.
#
# TO RESUME AN UPDATE: do it by hand, in a single readable commit — `npm audit
# fix` / `npm update <package>` on the frontend side (the lock is now diffable,
# see `.gitattributes`), `pip install -U` + `pip freeze` on the portal side —
# then push and let CI judge. To re-enable PRs, put a non-zero
# `open-pull-requests-limit` below (start at 1: one batch at a time, never
# three open branches in parallel).
#
# RULE learned on 2026-09-17 (it applies to any manual update): a batch
# contains ONLY minors and patches (`update-types`). The first npm batch
# grouped everything and proposed at once React 19.3, eslint 10, TypeScript 7,
# KaTeX 0.18 and Astryx 0.6 — which `npm ci` refuses to install, so a PR
# neither reviewable nor mergeable. A major is a project of its own: it
# deserves its own PR, with its own CI.
version: 2

updates:
  # Flask portal
  - package-ecosystem: pip
    directory: /dgx-portal
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      portail-python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Next.js UI
  - package-ecosystem: npm
    directory: /dgx-portal-frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      frontend-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Astryx is the design system: a minor can change the rendering of 153
      # components. A PR for a PATCH is welcome, but we do not want to be woken
      # up every week by a 0.x — bumps of this dependency are decided and
      # verified by hand (`npx astryx upgrade`). MAJORs are still proposed,
      # outside a batch, precisely so they get their own PR.
      - dependency-name: "@astryxdesign/core"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@astryxdesign/cli"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@astryxdesign/theme-neutral"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # Node TYPES follow the RUNTIME, they do not precede it: the image is
      # `node:20-slim` (pinned by digest, see Dockerfile). Having `@types/node`
      # 26 compile on a Node 20 would make `tsc` accept APIs absent at runtime
      # — a divergence CI cannot see, since it only checks that the current code
      # compiles. The day the runtime moves, both are updated in the same
      # commit.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 and ESLint 10 are BLOCKED UPSTREAM, not by our code —
      # measured on 2026-09-17 on both PRs (#6, #8): both fail at the Lint
      # step, never at install nor type-check.
      #   - #6: `npx tsc --noEmit` passes with TypeScript 7.0.2 (0 errors), but
      #     `typescript-eslint` — provided by `eslint-config-next` — RAISES at
      #     import as soon as `typescript` major ≥ 7 (« typescript-eslint does not
      #     support TS 7.0 », tracked upstream: typescript-eslint#10940).
      #   - #8: ESLint 10 removes `context.getFilename()`; the
      #     `eslint-plugin-react` provided by `eslint-config-next` still calls
      #     it, and the LAST published version (7.37.5) still declares
      #     `eslint: ^3 … ^9.7` — no downstream fix available.
      # Shipping them would mean replacing Next.js linting with a home-made
      # configuration: that is not a dependency bump, it is a project in itself
      # (and it would drop rules we want to keep).
      # TO RESUME: remove the two `ignore` entries below, then
      # `npm i -D typescript@^7 eslint@^10 && npx tsc --noEmit && npx eslint .` —
      # if lint passes, the bump is ripe; otherwise, put the ignore back.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # Workflow actions: a compromised third-party action runs with the repo's
  # token — hence the SHA pinning, which Dependabot knows how to maintain.
  # On hold like the others (same reason: ONE branch), but the watch remains:
  # third-party actions too show up in the dependency graph and therefore in
  # Dependabot alerts. A SHA bump is done by hand, and reviewed in one line.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
