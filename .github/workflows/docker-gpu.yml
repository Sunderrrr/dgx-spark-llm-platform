# Build the five GPU sidecar images: asr, voice (Chatterbox + Kyutai + Qwen
# variants), image-gen. Each one is a multi-GB CUDA 13.0 + torch cu130 build —
# running that on EVERY push would make the whole repo's CI slower for a check
# that rarely changes. So this workflow has its own trigger set:
#   - push to master touching one of the five directories (paths filter),
#   - a pull request touching them (the gate BEFORE the merge, not after),
#   - a weekly schedule, so a recipe that rots on its own (base image pulled
#     from the registry, upstream release renamed) is caught without a push,
#   - workflow_dispatch, to rebuild everything on demand from the Actions tab.
#
# Build ONLY, never push: the Spark stays the builder of record (the recreate
# scripts build there), CI proves the recipe still compiles. Known boundary:
# runners are amd64, the GB10 is aarch64 (sm_121) — this catches Dockerfile
# errors, missing files, failing pip resolves and broken entrypoints, not the
# arm-specific compilation, which only the box can do.
#
# Same token discipline as ci.yml: read-only, nothing more. A pull request from
# a fork runs these builds — it has no secret to steal, and the build is done
# inside the runner's Docker daemon, which is the accepted risk of "we compile
# what the PR proposes" (the same one `ci.yml` takes for the two shipped
# images).
name: GPU images

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"  # Monday 03:17 UTC — off the top of the hour
  push:
    branches: [master]
    paths:
      - "asr/**"
      - "voice/**"
      - "voice-kyutai/**"
      - "voice-qwen/**"
      - "image-gen/**"
      - ".github/workflows/docker-gpu.yml"
  pull_request:
    branches: [master]
    paths:
      - "asr/**"
      - "voice/**"
      - "voice-kyutai/**"
      - "voice-qwen/**"
      - "image-gen/**"
      - ".github/workflows/docker-gpu.yml"

permissions:
  contents: read

concurrency:
  group: gpu-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.dir }}
    runs-on: ubuntu-latest
    # A CUDA/torch image build is long, but not six hours long: the default
    # timeout (360 min) only hides a hung `pip resolve` that never finishes.
    timeout-minutes: 60
    # fail-fast: false — five independent images: one red must not hide the
    # state of the four others (the fix is per-directory anyway).
    strategy:
      fail-fast: false
      matrix:
        dir: [asr, voice, voice-kyutai, voice-qwen, image-gen]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # BuildKit caches layers BETWEEN runs of the same job (gha cache backend):
      # without it, every run re-downloads the CUDA base and the pip wheels —
      # the single most expensive thing this repo does in CI. The cache key is
      # the directory, so the five images do not evict one another.
      - name: Set up BuildKit
        run: |
          docker buildx create --name gpu-ci --use --driver docker-container >/dev/null
          docker buildx inspect --bootstrap >/dev/null
      - name: Build the image (no push)
        # `--load` keeps the image in the local daemon like a plain `docker
        # build` would: the recipe is proven, nothing leaves the runner.
        run: |
          docker buildx build \
            --cache-from "type=gha,scope=${{ matrix.dir }}" \
            --cache-to "type=gha,mode=max,scope=${{ matrix.dir }}" \
            --load \
            -t "gpu-ci:${{ matrix.dir }}" \
            "${{ matrix.dir }}"
      - name: Report the image size
        if: always()
        run: |
          size=$(docker image inspect "gpu-ci:${{ matrix.dir }}" --format '{{.Size}}' 2>/dev/null || echo 0)
          {
            echo "## ${{ matrix.dir }}"
            echo
            echo "Image built: $(( size / 1024 / 1024 )) MiB (cache: gha/${{ matrix.dir }})"
          } >> "$GITHUB_STEP_SUMMARY"
