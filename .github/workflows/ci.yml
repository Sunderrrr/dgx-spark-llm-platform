name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Le jeton du workflow n'a besoin de RIEN écrire : on le borne explicitement.
# Sans ce bloc, il hérite des droits par défaut du dépôt (lecture/écriture selon
# les réglages), donc une action tierce compromise pourrait pousser du code.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (unittest, in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # run-tests.sh builds the portal image via compose and runs the suite in a
      # throwaway container with a fresh SQLite DB — same deps as production.
      # Pin the compose project name so the built image is `ai-platform-dgx-portal`
      # (the name the script runs), independent of the checkout directory name.
      - name: Run test suite
        env:
          COMPOSE_PROJECT_NAME: ai-platform
        run: ./dgx-portal/run-tests.sh

  frontend:
    name: Frontend (types + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dgx-portal-frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dgx-portal-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      # Une clé i18n manquante ne casse RIEN : le texte retombe silencieusement
      # sur le français, donc l'utilisateur anglophone lit du français sans que
      # personne ne s'en aperçoive. Ce contrôle rend l'oubli bruyant — c'est tout
      # son intérêt, il n'a pas besoin d'être exhaustif. Tourne sur python3, déjà
      # présent sur le runner, et analyse l'arbre depuis la racine du dépôt.
      - name: i18n coverage
        working-directory: .
        run: python3 scripts/check-i18n.py

  # Veille dépendances : ADVISORY (`continue-on-error`). Le but est de rendre une
  # vulnérabilité connue VISIBLE dans le run, pas de bloquer un push sur une
  # annonce amont qui ne nous concerne peut-être pas — les deux écosystèmes sont
  # figés par des lockfiles, donc l'analyse est reproductible. Dependabot
  # (`.github/dependabot.yml`) ouvre en parallèle les PR de mise à jour.
  dependencies:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: pip-audit (portail)
        run: |
          python3 -m pip install --quiet pip-audit
          pip-audit -r dgx-portal/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
      - name: npm audit (frontend)
        working-directory: dgx-portal-frontend
        run: npm audit --package-lock-only --audit-level=high
