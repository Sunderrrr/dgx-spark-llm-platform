name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Le jeton du workflow n'a besoin de RIEN écrire : on le borne explicitement.
# Sans ce bloc, il hérite des droits par défaut du dépôt (lecture/écriture selon
# les réglages), donc une action tierce compromise pourrait pousser du code.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Le moins coûteux en premier : trois fichiers doivent rester d'accord sur la
  # version (package.json, son lockfile, l'entrée la plus récente du CHANGELOG),
  # et un désaccord ne casse aucun test — il rend juste impossible de dire ce qui
  # tourne en production. `release.sh --check` est le même code que celui qui
  # publie, donc la vérification ne peut pas dériver de la publication.
  version:
    name: Version coherence (package ↔ CHANGELOG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check version coherence
        run: ./scripts/release.sh --check

  backend:
    name: Backend tests (unittest, in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # run-tests.sh builds the portal image via compose and runs the suite in a
      # throwaway container with a fresh SQLite DB — same deps as production.
      # Pin the compose project name so the built image is `ai-platform-dgx-portal`
      # (the name the script runs), independent of the checkout directory name.
      - name: Run test suite
        env:
          COMPOSE_PROJECT_NAME: ai-platform
        run: ./dgx-portal/run-tests.sh

  frontend:
    name: Frontend (types + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dgx-portal-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dgx-portal-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # `next-env.d.ts` est GÉNÉRÉ par Next et volontairement git-ignoré : il
      # référence `.next/**`, qui n'existe pas dans un clone neuf. Sans lui, `tsc`
      # ne connaît ni les types d'images (`import favicon from "@/app/favicon.ico"`)
      # ni ceux des routes — le type-check échouait donc en CI, tout en passant sur
      # nos machines où `next dev` avait déjà écrit le fichier. `next typegen` les
      # produit sans lancer de build complet (~2 s), ce qui rend la CI reproductible.
      - name: Generate Next types
        run: npx next typegen
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      # Une clé i18n manquante ne casse RIEN : le texte retombe silencieusement
      # sur le français, donc l'utilisateur anglophone lit du français sans que
      # personne ne s'en aperçoive. Ce contrôle rend l'oubli bruyant — c'est tout
      # son intérêt, il n'a pas besoin d'être exhaustif. Tourne sur python3, déjà
      # présent sur le runner, et analyse l'arbre depuis la racine du dépôt.
      - name: i18n coverage
        working-directory: .
        run: python3 scripts/check-i18n.py

  # Veille dépendances : ADVISORY, et advisory jusqu'au bout.
  #
  # Deux leçons du 2026-10-01. D'abord, un avis amont ne concerne pas forcément ce
  # dépôt et n'a souvent aucun correctif disponible : bloquant, il transforme une
  # annonce en pipeline rouge permanent — et un rouge permanent n'est plus lu.
  # Ensuite, `continue-on-error` posé sur le JOB ne suffisait pas : le run restait
  # vert mais le job portait quand même une croix rouge, ce qui se lit comme un
  # échec (c'est exactement ce qu'on voyait).
  #
  # Le signal est donc CONSERVÉ, mais ne rougit plus : chaque étape sort en 0, la
  # sortie complète reste dans le journal, le résumé du run reprend les avis
  # trouvés, et un `::warning::` les signale en jaune sur la page du run. La veille
  # de fond reste les alertes Dependabot (onglet Security).
  dependencies:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: pip-audit (portail)
        run: |
          python3 -m pip install --quiet pip-audit
          sortie=$(pip-audit -r dgx-portal/requirements.txt 2>&1) && etat=0 || etat=$?
          printf '%s\n' "$sortie"
          {
            echo '## pip-audit — `dgx-portal/requirements.txt`'
            echo
            echo '```'
            printf '%s\n' "$sortie"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$etat" != 0 ]; then
            echo "::warning title=Dépendances Python::pip-audit signale un avis (advisory, non bloquant) — détails dans le résumé de ce run."
          fi
          exit 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
      - name: npm audit (frontend)
        working-directory: dgx-portal-frontend
        run: |
          sortie=$(npm audit --package-lock-only --audit-level=high 2>&1) && etat=0 || etat=$?
          printf '%s\n' "$sortie"
          {
            echo '## npm audit — `dgx-portal-frontend`'
            echo
            echo '```'
            printf '%s\n' "$sortie"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$etat" != 0 ]; then
            echo "::warning title=Dépendances npm::npm audit signale un avis (advisory, non bloquant) — détails dans le résumé de ce run."
          fi
          exit 0
