name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The workflow token needs NO write access: we bound it explicitly.
# Without this block, it inherits the repo's default permissions (read/write
# depending on settings), so a compromised third-party action could push code.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheapest first: three files must agree on the version (package.json, its
  # lockfile, the most recent CHANGELOG entry), and a disagreement breaks no
  # test — it just makes it impossible to tell what runs in production.
  # `release.sh --check` is the same code as the one that publishes, so the
  # check cannot drift from the publication.
  version:
    name: Version coherence (package ↔ CHANGELOG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check version coherence
        run: ./scripts/release.sh --check

  secrets:
    name: Secret scan (commit messages + diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the pushed history
        # A secret that lands in a COMMIT MESSAGE is public the moment the tag
        # is pushed, and rewriting history afterwards does not make readers
        # forget (the incident of 2026-10-06). The local hooks stop it at the
        # entrance — this job is the net for a `--no-verify` push.
        run: |
          RE='(-----BEGIN [A-Z ]*PRIVATE KEY-----|sk-[A-Za-z0-9]{24,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{50,}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{30,})'
          PH='(changeme|change-me|placeholder|example|sk-test|sk-changeme|your[-_]?key|xxxxx)'
          RANGE="${{ github.event.before }}..${{ github.sha }}"
          case "$RANGE" in 000000*) RANGE="${{ github.sha }}" ;; esac
          hit=0
          git log --format=%B "$RANGE" | grep -E "$RE" | grep -Evq "$PH" \
            && { echo "::error::Secret-looking value in a COMMIT MESSAGE"; hit=1; } || true
          git diff "$RANGE" 2>/dev/null | grep -E '^\+[^+]' | grep -E "$RE" | grep -Evq "$PH" \
            && { echo "::error::Secret-looking value in the diff"; hit=1; } || true
          git diff --diff-filter=AM --name-only "$RANGE" 2>/dev/null | grep -Eq '(^|/)(\.env(\..*)?|DEBUG_USERS\.txt|.*\.pem|.*\.key|id_rsa.*)$' \
            && { echo "::error::Forbidden file in the push"; hit=1; } || true
          exit $hit

  backend:
    name: Backend tests (unittest, in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # run-tests.sh builds the portal image via compose and runs the suite in a
      # throwaway container with a fresh SQLite DB — same deps as production.
      # Pin the compose project name so the built image is `ai-platform-dgx-portal`
      # (the name the script runs), independent of the checkout directory name.
      - name: Run test suite
        env:
          COMPOSE_PROJECT_NAME: ai-platform
        run: ./dgx-portal/run-tests.sh

  frontend:
    name: Frontend (types + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dgx-portal-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dgx-portal-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # `next-env.d.ts` is GENERATED by Next and deliberately git-ignored: it
      # references `.next/**`, which does not exist in a fresh clone. Without
      # it, `tsc` knows neither image types (`import favicon from "@/app/favicon.ico"`)
      # nor route ones — so type-checking failed in CI, while passing on our
      # machines where `next dev` had already written the file. `next typegen`
      # produces them without a full build (~2 s), which makes CI reproducible.
      - name: Generate Next types
        run: npx next typegen
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      # A missing i18n key breaks NOTHING: the text silently falls back to
      # French, so the English-speaking user reads French without anyone
      # noticing. This check makes the omission noisy — that is its whole point,
      # it does not need to be exhaustive. Runs on python3, already present on
      # the runner, and analyzes the tree from the repo root.
      - name: i18n coverage
        working-directory: .
        run: python3 scripts/check-i18n.py

  # Dependency watch: ADVISORY, and advisory all the way through.
  #
  # Two lessons from 2026-10-01. First, an upstream advisory does not
  # necessarily concern this repo and often has no fix available: blocking, it
  # turns an announcement into a permanently red pipeline — and a permanent red
  # is no longer read. Next, `continue-on-error` on the JOB was not enough: the
  # run stayed green but the job still carried a red cross, which reads as a
  # failure (exactly what we were seeing).
  #
  # So the signal is KEPT, but no longer reddens: every step exits 0, the full
  # output stays in the log, the run summary includes the advisories found, and
  # a `::warning::` flags them in yellow on the run page. The background watch
  # remains the Dependabot alerts (Security tab).
  dependencies:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: pip-audit (portail)
        run: |
          python3 -m pip install --quiet pip-audit
          sortie=$(pip-audit -r dgx-portal/requirements.txt 2>&1) && etat=0 || etat=$?
          printf '%s\n' "$sortie"
          {
            echo '## pip-audit — `dgx-portal/requirements.txt`'
            echo
            echo '```'
            printf '%s\n' "$sortie"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$etat" != 0 ]; then
            echo "::warning title=Dépendances Python::pip-audit signale un avis (advisory, non bloquant) — détails dans le résumé de ce run."
          fi
          exit 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
      - name: npm audit (frontend)
        working-directory: dgx-portal-frontend
        run: |
          sortie=$(npm audit --package-lock-only --audit-level=high 2>&1) && etat=0 || etat=$?
          printf '%s\n' "$sortie"
          {
            echo '## npm audit — `dgx-portal-frontend`'
            echo
            echo '```'
            printf '%s\n' "$sortie"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$etat" != 0 ]; then
            echo "::warning title=Dépendances npm::npm audit signale un avis (advisory, non bloquant) — détails dans le résumé de ce run."
          fi
          exit 0
