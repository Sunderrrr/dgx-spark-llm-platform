# Publish a release from a `vX.Y.Z` tag.
#
# Why the release is built from CHANGELOG.md and not copied by hand: the body
# of a GitHub release is what a user arriving six months later reads, and that
# is exactly what goes out of sync with the file as soon as it is copied. Here
# the two cannot diverge — the workflow extracts the section with the same code
# as the local check (`release.sh --notes`).
#
# The tag itself carries the same notes: a `git tag -a` set by
# `scripts/release.sh` embeds them, so the information survives the remote
# repo.
name: Release

on:
  push:
    tags: ["v*"]

# The token must be able to create the release, and NOTHING more: no content
# in write mode, no packages, no actions.
permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # A tag can be pushed without going through the script (by hand, or from
      # another machine): so we re-check the tag ↔ package ↔ CHANGELOG
      # agreement before publishing anything.
      - name: Verify version coherence
        run: ./scripts/release.sh --check "$GITHUB_REF_NAME"

      - name: Build the release notes from CHANGELOG.md
        run: ./scripts/release.sh --notes "$GITHUB_REF_NAME" > /tmp/notes.md

      # `gh` is preinstalled on the runners: no third-party action to pin for
      # an operation that fits in one command.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --verify-tag
