model_list:
  # Ornith arrêté (2026-08-04) pour libérer la mémoire unifiée au profit de
  # kat-coder-v2.5 — le runner ne sert qu'un seul modèle à la fois sur :8000.
  # Pour le remettre : relancer via vllm-runner (~/start_ornith.sh ou API
  # /launch) puis décommenter ce bloc.
  # - model_name: ornith-35b-fp8
  #   litellm_params:
  #     model: openai/ornith-35b-fp8
  #     api_base: http://host.docker.internal:8000/v1
  #     api_key: dummy
  #     input_cost_per_token: 1
  #     output_cost_per_token: 1
  #   model_info:
  #     mode: chat
  #     supports_function_calling: true
  #     max_input_tokens: 262144
  #     max_output_tokens: 65536

  - model_name: kat-coder-v2.5
    litellm_params:
      model: openai/kat-coder-v2.5
      api_base: http://host.docker.internal:8000/v1
      api_key: dummy
      input_cost_per_token: 1
      output_cost_per_token: 1
    model_info:
      mode: chat
      supports_function_calling: true
      # --max-model-len 262144 (256K) côté vLLM ; --reasoning-parser qwen3
      max_input_tokens: 262144
      max_output_tokens: 65536

  # Les modèles ajoutés depuis le portail (validation d'une demande ou ajout manuel)
  # sont enregistrés à chaud dans la DB via /model/new — pas besoin de les lister ici.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

# Le proxy route via le Router LiteLLM : c'est ICI (pas dans litellm_settings)
# que se règlent les retries et le timeout du routeur. num_retries: 0 évite
# qu'une requête lente/coincée soit rejouée et saisisse des slots supplémentaires
# sur le backend mono-instance (llama.cpp, 4 slots) jusqu'à tout bloquer.
router_settings:
  num_retries: 0
  timeout: 300
  allowed_fails: 100
  cooldown_time: 5

litellm_settings:
  drop_params: true
  default_max_budget: 2000000
  default_budget_duration: "1d"
  # Anti « slots bloqués » : par défaut LiteLLM RÉESSAIE une requête qui
  # échoue/pend — sur un modèle mono-backend lent (llama.cpp, 4 slots), chaque
  # retry saisit un slot de plus, et quelques échecs suffisent à tout bloquer.
  # On coupe les retries, et on borne la durée d'une requête (filet de sécurité :
  # une requête vraiment coincée est abandonnée, ce qui ferme la connexion vers
  # llama.cpp et libère le slot).
  num_retries: 0
  request_timeout: 300
