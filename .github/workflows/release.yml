# Publication d'une release à partir d'un tag `vX.Y.Z`.
#
# Pourquoi la release est construite depuis CHANGELOG.md et non recopiée à la
# main : le corps d'une release GitHub est ce que lit un utilisateur qui arrive
# six mois plus tard, et c'est exactement ce qui se désynchronise du fichier dès
# qu'on le recopie. Ici les deux ne peuvent pas diverger — le workflow extrait la
# section avec le même code que la vérification locale (`release.sh --notes`).
#
# Le tag lui-même porte les mêmes notes : un `git tag -a` posé par
# `scripts/release.sh` les embarque, donc l'information survit au dépôt distant.
name: Release

on:
  push:
    tags: ["v*"]

# Le jeton doit pouvoir créer la release, et RIEN de plus : pas de contenu lu en
# écriture, pas de paquets, pas d'actions.
permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Un tag peut être poussé sans passer par le script (à la main, ou depuis
      # une autre machine) : on revérifie donc l'accord tag ↔ paquet ↔ CHANGELOG
      # avant de publier quoi que ce soit.
      - name: Verify version coherence
        run: ./scripts/release.sh --check "$GITHUB_REF_NAME"

      - name: Build the release notes from CHANGELOG.md
        run: ./scripts/release.sh --notes "$GITHUB_REF_NAME" > /tmp/notes.md

      # `gh` est préinstallé sur les runners : pas d'action tierce à épingler pour
      # une opération qui tient en une commande.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --verify-tag
