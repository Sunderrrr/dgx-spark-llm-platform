# nvidia-cdi-refresh.path watches ONLY /lib/modules/*/modules.dep. A userspace
# driver update replaces the versioned libraries WITHOUT touching modules.dep, so
# the CDI spec keeps naming a file that no longer exists and EVERY container with
# `--gpus all` fails at creation:
#
#   failed to fulfil mount request: open /usr/lib/aarch64-linux-gnu/
#   libnvidia-egl-wayland.so.1.1.23: no such file or directory
#
# Measured on 2026-11-27: the spec was generated on the 24th, the driver shipped
# .1.1.24, and voice/asr/ocr/image would not start until
# `nvidia-ctk cdi generate` was run by hand. Watching the libraries makes the
# unit that already exists do it.
[Path]
PathChanged=/usr/lib/aarch64-linux-gnu/libnvidia-egl-wayland.so.1
PathChanged=/usr/lib/aarch64-linux-gnu/libnvidia-egl-gbm.so.1
PathChanged=/usr/lib/aarch64-linux-gnu/libnvidia-glcore.so.1
PathChanged=/usr/lib/aarch64-linux-gnu/libcuda.so.1
