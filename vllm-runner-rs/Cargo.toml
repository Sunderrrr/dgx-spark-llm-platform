[package]
name = "vllm-runner-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "runner_rs"
path = "src/lib.rs"

[[bin]]
name = "vllm-runner"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
nix = { version = "0.27", features = ["process"] }
regex = "1"
tokio-stream = "0.1"

[dev-dependencies]
# `oneshot`, to call the router in memory: the decision routes' Extension is a
# wiring detail no handler test can see (cf. decisions_routes).
tower = { version = "0.4", features = ["util"] }
