# GLOBAL safety net against OOM (set on 2026-10-01, after a crash loop). On
# the GB10 GPU memory appears in no process: the kernel's OOM killer is blind
# to it and kills everything else (443 processes on 2026-10-01, machine frozen
# then rebooted). earlyoom acts BEFORE it, on MemAvailable — which GPU memory
# does lower.
#
#  -m 3,2       SIGTERM under 3 % of available memory (~3.7 GB), SIGKILL under 2 %
#  -s 100,100   IGNORE swap: by default earlyoom ALSO requires low swap, but GPU
#               memory does not swap (75 % of swap free during the OOM) — with
#               the default settings it would never have fired
#  --prefer     target llama-server: its GPU memory is not in its RSS, without
#               this preference earlyoom would kill an innocent high-RSS process
#  --avoid      never touch the services the machine's access depends on
#  $$ = literal $ in a systemd unit file
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -m 3,2 -s 100,100 -r 3600 -p --prefer (^|/)llama-server$$ --avoid (^|/)(sshd|systemd|systemd-[a-z-]+|dockerd|containerd|containerd-shim|traefik|postgres|init|earlyoom)$$
