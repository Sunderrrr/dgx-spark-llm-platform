model_list:
  # Modèles statiques ornith-35b-fp8 et kat-coder-v2.5 supprimés le 2026-08-15
  # (retirés du catalogue + poids effacés du disque, à la demande). Les modèles
  # ajoutés depuis le portail (validation d'une demande ou ajout manuel)
  # sont enregistrés à chaud dans la DB via /model/new — pas besoin de les lister ici.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

# Le proxy route via le Router LiteLLM : c'est ICI (pas dans litellm_settings)
# que se règlent les retries et le timeout du routeur. num_retries: 0 évite
# qu'une requête lente/coincée soit rejouée et saisisse des slots supplémentaires
# sur le backend mono-instance (llama.cpp, 4 slots) jusqu'à tout bloquer.
router_settings:
  num_retries: 0
  timeout: 300
  allowed_fails: 100
  cooldown_time: 5

litellm_settings:
  drop_params: true
  default_max_budget: 2000000
  default_budget_duration: "1d"
  # Anti « slots bloqués » : par défaut LiteLLM RÉESSAIE une requête qui
  # échoue/pend — sur un modèle mono-backend lent (llama.cpp, 4 slots), chaque
  # retry saisit un slot de plus, et quelques échecs suffisent à tout bloquer.
  # On coupe les retries, et on borne la durée d'une requête (filet de sécurité :
  # une requête vraiment coincée est abandonnée, ce qui ferme la connexion vers
  # llama.cpp et libère le slot).
  num_retries: 0
  request_timeout: 300
  # Qui utilise le modele MAINTENANT. LiteLLM n'ecrit SpendLogs qu'a la fin d'une
  # requete et n'expose aucune liste de requetes en vol : le panneau admin du
  # portail ne pouvait donc nommer personne pendant une generation (mesure du
  # 2026-09-14 : 44 minutes sans la moindre ligne alors que deux sessions
  # travaillaient). Ce callback note l'ouverture au depart et la retire a la fin,
  # dans un petit SQLite que le portail monte en lecture seule. Il ne peut pas
  # faire echouer une requete : toute erreur est tracee puis ignoree.
  callbacks: ["cronos_inflight.en_vol"]
